name: Test and deploy Venture Signal to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: venture-signal-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript and research calculations
        run: |
          node --check dist/app.js
          node --check dist/research.mjs
          node tests/research.test.mjs
          node --check dist/dynamic.mjs
          node --check backend/worker.mjs
          node tests/backend.test.mjs
          python3 tests/test_signals.py
      - name: Refresh public business news
        run: python3 scripts/refresh-signals.py
      - name: Install browser QA tools
        run: |
          npm install --prefix /tmp/venture-browser --no-audit --no-fund playwright@1.56.1
          node /tmp/venture-browser/node_modules/playwright/cli.js install --with-deps chromium
      - name: Test the mobile browser interface
        env:
          BROWSER_MODULE_ROOT: /tmp/venture-browser
        run: node tests/browser-smoke.mjs
      - name: Configure or deploy optional AI backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/deploy-backend.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static application
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published HTML and JavaScript
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$PAGE_URL" -o /tmp/venture-page.html
          grep -q 'id="researchForm"' /tmp/venture-page.html
          curl --fail --retry 3 --retry-delay 5 --max-time 30 "${PAGE_URL%/}/app.js" -o /tmp/venture-app.js
          curl --fail --retry 3 --retry-delay 5 --max-time 30 "${PAGE_URL%/}/research.mjs" -o /tmp/venture-research.mjs
          node --check /tmp/venture-app.js
          node --check /tmp/venture-research.mjs
          curl --fail --retry 3 --retry-delay 5 --max-time 30 "${PAGE_URL%/}/dynamic.mjs" -o /tmp/venture-dynamic.mjs
          node --check /tmp/venture-dynamic.mjs
          curl --fail --retry 3 --retry-delay 5 --max-time 30 "${PAGE_URL%/}/signals.json" -o /tmp/venture-signals.json
          python3 -c 'import json; d=json.load(open("/tmp/venture-signals.json")); assert isinstance(d["signals"],list); print(str(len(d["signals"]))+" published news signals")' 
